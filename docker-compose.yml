services:
  originalroot:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ORIGINALROOT_HOST: 0.0.0.0
      ORIGINALROOT_PORT: 8080
      ORIGINALROOT_DB_PATH: /data/originalroot.sqlite3
      ORIGINALROOT_OPERATOR_TOKEN: ${ORIGINALROOT_OPERATOR_TOKEN:-${OriginalRoot_OPERATOR_TOKEN:-}}
      ORIGINALROOT_DATA_GOV_IN_API_KEY: ${ORIGINALROOT_DATA_GOV_IN_API_KEY:-${OriginalRoot_DATA_GOV_IN_API_KEY:-}}
      ORIGINALROOT_COOKIE_SECURE: ${ORIGINALROOT_COOKIE_SECURE:-${OriginalRoot_COOKIE_SECURE:-0}}
    volumes:
      - OriginalRoot-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  OriginalRoot-data:

