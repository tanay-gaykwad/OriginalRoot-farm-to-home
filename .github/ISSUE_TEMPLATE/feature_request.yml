name: Feature request
description: Propose an improvement to a OriginalRoot workflow
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Who has the problem?
      description: Describe the grower, customer, or operator and the situation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become easier, safer, or clearer?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: Add a sketch or workflow if useful; implementation ideas are optional.
