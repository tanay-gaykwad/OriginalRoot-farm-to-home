name: OriginalRoot build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm build
      - name: Check API syntax
        run: python -m py_compile api/server.py api/backup.py
      - name: Build local Docker image
        run: docker build --tag originalroot-farm-to-home:ci .
